<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muwatta Malik — word-by-word</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#121212; --muted:#6a6a6a; --faint:#9b9b9b; --line:#ececec; --hl:#fff3cf;
    --ar:"KFGQPC Uthman Taha Naskh","Scheherazade New",serif; --ui:Inter,-apple-system,sans-serif; --ur:"Noto Nastaliq Urdu",serif;
    --ar-size:1.7rem; --ur-size:.8rem; --wbw-gap:20px; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f0f0f; --ink:#ececec; --muted:#9a9a9a; --faint:#6a6a6a; --line:#262626; --hl:#3a3320; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--ui); padding:0 16px 80px; -webkit-font-smoothing:antialiased; }
  header { border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:6; }
  .in { max-width:940px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:12px 2px; flex-wrap:wrap; }
  h1 { font-size:1rem; font-weight:700; } h1 span{ color:var(--faint); font-weight:500; font-size:.8rem; }
  .sp { flex:1; }
  select, .stepper { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; font-size:.82rem; }
  select { padding:7px 10px; font-family:var(--ui); }
  .stepper { display:inline-flex; align-items:center; gap:2px; padding:2px; }
  .stepper b { color:var(--muted); font-size:.72rem; padding:0 5px; } .stepper button{ border:0; background:transparent; color:var(--ink); cursor:pointer; font-size:.95rem; width:24px; height:26px; border-radius:6px; } .stepper button:hover{ background:var(--line); }
  .tog b { cursor:pointer; font-weight:500; font-size:.78rem; border:1px solid var(--line); border-radius:20px; padding:6px 12px; color:var(--muted); } .tog b.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  main { max-width:940px; margin:0 auto; padding-top:14px; }
  section { padding:22px 0; border-bottom:1px solid var(--line); }
  .hn { font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:.72rem; }
  .isnad { color:var(--faint); font-size:.72rem; margin:5px 0 14px; direction:rtl; font-family:var(--ar); }
  .wbw { direction:rtl; display:flex; flex-wrap:wrap; gap:var(--wbw-gap) 4px; }
  .w { display:inline-flex; flex-direction:column; align-items:center; padding:5px 6px 7px; border-radius:8px; } .w:hover{ background:var(--hl); }
  .w .t { font-family:var(--ar); font-size:var(--ar-size); line-height:1.85; }
  .w .en { font-family:var(--ui); font-size:.68rem; color:var(--muted); direction:ltr; margin-top:4px; text-align:center; max-width:120px; line-height:1.3; }
  .w .ur { font-family:var(--ur); font-size:var(--ur-size); color:var(--muted); direction:rtl; margin-top:5px; text-align:center; max-width:130px; line-height:1.85; }
  body.hide-en .w .en{display:none} body.hide-ur .w .ur{display:none}
  .pend { color:var(--faint); font-style:italic; font-size:.72rem; }
  .note { color:var(--faint); font-size:.75rem; text-align:center; margin:26px auto 0; max-width:640px; line-height:1.6; }
</style>

<header><div class="in">
  <h1>Muwatta Malik <span>· word-by-word</span></h1>
  <div class="sp"></div>
  <select id="book" title="Book"></select>
  <span class="stepper"><b>ع</b><button id="arMinus">−</button><button id="arPlus">+</button></span>
  <span class="stepper"><b>اردو</b><button id="urMinus">−</button><button id="urPlus">+</button></span>
  <span class="stepper"><b>Spacing</b><button id="spMinus">−</button><button id="spPlus">+</button></span>
  <span class="tog"><b data-l="en" class="on">EN</b><b data-l="ur" class="on">UR</b></span>
</div></header>

<main><div id="list" class="note" style="padding:40px 0">Loading…</div><div class="note" id="foot"></div></main>

<script>
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem("mk:"+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem("mk:"+k,JSON.stringify(v))};
let arS=store.get("ar",1.7), urS=store.get("ur",0.8), spS=store.get("sp",20);
function applyFonts(){document.documentElement.style.setProperty("--ar-size",arS+"rem");document.documentElement.style.setProperty("--ur-size",urS+"rem");document.documentElement.style.setProperty("--wbw-gap",spS+"px");store.set("ar",arS);store.set("ur",urS);store.set("sp",spS);}
arPlus.onclick=()=>{arS=Math.min(arS+0.15,3.2);applyFonts();};arMinus.onclick=()=>{arS=Math.max(arS-0.15,1.1);applyFonts();};
urPlus.onclick=()=>{urS=Math.min(urS+0.1,1.6);applyFonts();};urMinus.onclick=()=>{urS=Math.max(urS-0.1,0.6);applyFonts();};
spPlus.onclick=()=>{spS=Math.min(spS+6,60);applyFonts();};spMinus.onclick=()=>{spS=Math.max(spS-6,6);applyFonts();};
document.querySelectorAll(".tog b").forEach(b=>b.onclick=()=>{b.classList.toggle("on");document.body.classList.toggle("hide-"+b.dataset.l,!b.classList.contains("on"));});
applyFonts();

const bookSel=document.getElementById("book");
let idx;
(async()=>{
  idx=await (await fetch("malik/index.json",{cache:"no-cache"})).json();
  bookSel.innerHTML=idx.books.map(b=>`<option value="${b.book}">Book ${b.book} (${b.count} hadith)</option>`).join("");
  bookSel.value=store.get("book",1); bookSel.onchange=()=>{store.set("book",bookSel.value);render(bookSel.value);};
  render(bookSel.value);
})();

async function render(bk){
  const list=document.getElementById("list"); list.className=""; list.innerHTML="<div class='note' style='padding:30px'>Loading book…</div>";
  const data=await (await fetch(`malik/book-${bk}.json`,{cache:"no-cache"})).json();
  list.innerHTML=""; let glossed=0;
  for(const h of data.hadith){
    const g=await (await fetch(`gloss/malik-${h.n}.json`,{cache:"no-cache"}).catch(()=>null))?.json?.()??null;
    const G=g&&g.glosses?g.glosses:null; if(G)glossed++;
    const sec=document.createElement("section");
    sec.innerHTML=`<div class="hn">Muwatta Malik ${h.n}${G?"":" <span class='pend'>· glosses pending</span>"}</div><div class="isnad">${h.isnad}</div>`;
    const wbw=document.createElement("div"); wbw.className="wbw";
    for(const t of h.tokens){const gg=G?(G[t.id]||{}):{};const d=document.createElement("div");d.className="w";d.innerHTML=`<span class="t">${t.text.replace(/[،:]/g,"")}</span><span class="en">${gg.en||""}</span><span class="ur">${gg.ur||""}</span>`;wbw.appendChild(d);}
    sec.appendChild(wbw); list.appendChild(sec);
  }
  document.getElementById("foot").textContent=`Book ${bk}: ${glossed}/${data.hadith.length} hadith glossed. Machine-generated (machine-suggested), independently reviewed where available.`;
  scrollTo(0,0);
}
</script>
