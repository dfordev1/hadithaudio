<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word-by-word — Nawawi 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Scheherazade+New:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#121212; --muted:#6a6a6a; --faint:#9b9b9b; --line:#ececec; --hl:#fff3cf;
    --ar:"KFGQPC Uthman Taha Naskh","Scheherazade New",serif; --ui:Inter,-apple-system,sans-serif; --ur:"Noto Nastaliq Urdu",serif; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f0f0f; --ink:#ececec; --muted:#9a9a9a; --faint:#6a6a6a; --line:#262626; --hl:#3a3320; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--ui); padding:0 18px 70px; -webkit-font-smoothing:antialiased; }
  header { border-bottom:1px solid var(--line); }
  header .in { max-width:920px; margin:0 auto; padding:16px 2px; }
  h1 { font-size:1.05rem; font-weight:700; } header p { color:var(--muted); font-size:.84rem; margin-top:3px; }
  main { max-width:920px; margin:0 auto; padding-top:26px; }
  .toggles { display:flex; gap:10px; margin-bottom:22px; }
  .toggles b { cursor:pointer; font-weight:500; font-size:.82rem; border:1px solid var(--line); border-radius:20px; padding:6px 14px; color:var(--muted); }
  .toggles b.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  /* RTL flow of word blocks */
  .wbw { direction:rtl; display:flex; flex-wrap:wrap; gap:6px 4px; align-items:flex-start; }
  .w { display:flex; flex-direction:column; align-items:center; padding:8px 8px 10px; border-radius:10px; min-width:60px; }
  .w:hover { background:var(--hl); }
  .w .ar { font-family:var(--ar); font-size:1.9rem; line-height:1.9; }
  .w .en { font-family:var(--ui); font-size:.72rem; color:var(--muted); direction:ltr; margin-top:4px; text-align:center; max-width:130px; }
  .w .ur { font-family:var(--ur); font-size:.85rem; color:var(--muted); direction:rtl; margin-top:5px; text-align:center; max-width:140px; line-height:1.9; }
  body.hide-en .w .en { display:none; } body.hide-ur .w .ur { display:none; }
  .note { color:var(--faint); font-size:.76rem; margin-top:30px; line-height:1.7; max-width:640px; }
</style>

<header><div class="in">
  <h1>Word-by-word — An-Nawawi's Forty, Hadith 1</h1>
  <p>Each Arabic word with its English &amp; Urdu gloss. A HUSX gloss layer keyed to token ids.</p>
</div></header>

<main>
  <div class="toggles">
    <b data-l="en" class="on">English</b>
    <b data-l="ur" class="on">اردو</b>
  </div>
  <div class="wbw" id="wbw">loading…</div>
  <div class="note" id="note"></div>
</main>

<script>
const TOK = "uh:token:nawawi-arbain.001:";
(async () => {
  const [rec, gloss] = await Promise.all([
    fetch("recitation/nawawi-arbain.001.json", {cache:"no-cache"}).then(r=>r.json()),
    fetch("gloss/nawawi40-1.json", {cache:"no-cache"}).then(r=>r.json())
  ]);
  const box = document.getElementById("wbw"); box.innerHTML = "";
  for (const t of rec.tokens) {
    const g = gloss.glosses[t.id] || {};
    const d = document.createElement("div"); d.className = "w";
    d.innerHTML = `<div class="ar">${t.text.replace(/[،:]/g,"")}</div>`
      + `<div class="en">${g.en || ""}</div>`
      + `<div class="ur">${g.ur || ""}</div>`;
    box.appendChild(d);
  }
  document.getElementById("note").textContent =
    gloss.note + "  Review state: " + gloss.reviewState + ".";
})();
document.querySelectorAll(".toggles b").forEach(b => b.onclick = () => {
  b.classList.toggle("on");
  document.body.classList.toggle("hide-" + b.dataset.l, !b.classList.contains("on"));
});
</script>
