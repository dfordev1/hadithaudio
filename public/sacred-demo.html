<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hadith.to — Sacred UI demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f3;
    --paper-deep: #e3e8ec;
    --ink: #10131a;
    --ink-soft: #2a3038;
    --muted: #5c646e;
    --faint: #8a929c;
    --rule: #c5cbc8;
    --gold: #9a8450;
    --gold-soft: rgba(154, 132, 80, 0.35);
    --dock: rgba(238, 241, 240, 0.92);
    --ar: "Scheherazade New", "Traditional Arabic", serif;
    --en: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --ease: ease-in-out;
    --dur-view: 450ms;
    --dur-fade: 420ms;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--en);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(170, 188, 200, 0.26), transparent 55%),
      radial-gradient(90% 60% at 100% 100%, rgba(150, 165, 175, 0.16), transparent 50%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    min-height: 100vh;
  }

  button {
    font-family: inherit;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }

  /* Demo banner */
  .demo-note {
    position: sticky;
    top: 0;
    z-index: 50;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0.55rem 1rem;
    border-bottom: 1px solid var(--rule);
    background: rgba(238, 241, 240, 0.85);
    backdrop-filter: blur(8px);
  }

  /* Landing */
  .landing {
    min-height: calc(100vh - 36px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem 5rem;
    text-align: center;
    opacity: 1;
    transition: opacity var(--dur-view) var(--ease), transform var(--dur-view) var(--ease);
  }
  .landing.is-leaving {
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
  }
  .landing[hidden] { display: none; }

  .ornament {
    width: 72px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 1.75rem;
  }

  .brand {
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1;
  }
  .brand span {
    color: var(--gold);
    font-weight: 400;
  }

  .tagline {
    margin-top: 1.1rem;
    max-width: 22rem;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--muted);
    font-weight: 400;
  }

  .enter {
    margin-top: 2.4rem;
    padding: 0.7rem 1.6rem;
    font-size: 0.92rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    border-bottom: 1px solid var(--gold);
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .enter:hover {
    color: var(--gold);
    border-color: var(--ink);
  }

  /* Reader */
  .reader {
    max-width: 42rem;
    margin: 0 auto;
    padding: 2.5rem 1.35rem 7.5rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity var(--dur-view) var(--ease), transform var(--dur-view) var(--ease);
  }
  .reader.is-in {
    opacity: 1;
    transform: none;
  }
  .reader[hidden] { display: none; }

  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--gold-soft);
  }
  .meta .collection {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .meta .ref {
    font-size: 0.85rem;
    color: var(--muted);
  }

  .stage {
    opacity: 1;
    transition: opacity var(--dur-fade) var(--ease);
  }
  .stage.is-fading {
    opacity: 0;
  }

  .isnad {
    font-family: var(--ar);
    direction: rtl;
    text-align: right;
    font-size: 1.15rem;
    line-height: 2;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .arabic {
    font-family: var(--ar);
    direction: rtl;
    text-align: right;
    font-size: clamp(1.85rem, 4.5vw, 2.35rem);
    line-height: 2.35;
    color: var(--ink);
    font-weight: 400;
  }

  .english {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--ink-soft);
  }

  .pager {
    margin-top: 2.5rem;
    display: flex;
    justify-content: center;
    gap: 0.5rem;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rule);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .dot.on {
    background: var(--gold);
    transform: scale(1.15);
  }

  /* Calm dock */
  .dock {
    position: fixed;
    left: 50%;
    bottom: 1.35rem;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.45rem 0.7rem;
    background: var(--dock);
    border: 1px solid var(--rule);
    backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-view) var(--ease);
  }
  .dock.is-in {
    opacity: 1;
    pointer-events: auto;
  }

  .dock-btn {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    transition: color 0.2s ease;
  }
  .dock-btn:hover { color: var(--ink); }
  .dock-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dock-btn.play {
    width: 48px;
    height: 48px;
    color: var(--ink);
  }
  .dock-btn.play svg { width: 20px; height: 20px; }

  .progress {
    width: 88px;
    height: 1px;
    background: var(--rule);
    margin: 0 0.55rem;
    position: relative;
    overflow: hidden;
  }
  .progress > i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: var(--gold);
    transition: width 0.2s linear;
  }
  .progress.is-playing > i {
    animation: scrub 18s linear forwards;
  }
  @keyframes scrub {
    from { width: 0%; }
    to { width: 100%; }
  }

  .back-brand {
    position: fixed;
    top: 2.6rem;
    left: 1.25rem;
    z-index: 30;
    font-size: 0.82rem;
    letter-spacing: -0.01em;
    color: var(--faint);
    opacity: 0;
    transition: opacity var(--dur-view) ease, color 0.18s ease;
  }
  .back-brand.is-in { opacity: 1; }
  .back-brand:hover { color: var(--ink); }

  @media (max-width: 520px) {
    .progress { width: 56px; }
    .back-brand { left: 1rem; top: 2.5rem; }
  }
</style>
</head>
<body>
  <div class="demo-note">Theme demo — production reader at <a href="/">/</a> now uses these tokens</div>

  <section class="landing" id="landing" aria-label="hadith.to">
    <div class="ornament" aria-hidden="true"></div>
    <h1 class="brand">hadith<span>.</span>to</h1>
    <button type="button" class="enter" id="enter">Enter the reader</button>
  </section>

  <button type="button" class="back-brand" id="backBrand" hidden>hadith.to</button>

  <main class="reader" id="reader" hidden>
    <header class="meta">
      <div class="collection" id="collection">Ṣaḥīḥ al-Bukhārī</div>
      <div class="ref" id="ref">Book 1 · 1</div>
    </header>

    <article class="stage" id="stage">
      <p class="isnad" id="isnad" dir="rtl" lang="ar"></p>
      <p class="arabic" id="arabic" dir="rtl" lang="ar"></p>
      <p class="english" id="english" lang="en"></p>
    </article>

    <div class="pager" id="pager" aria-hidden="true"></div>
  </main>

  <nav class="dock" id="dock" aria-label="Playback" hidden>
    <button type="button" class="dock-btn" id="prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button type="button" class="dock-btn play" id="play" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button type="button" class="dock-btn" id="next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="progress" id="progress" aria-hidden="true"><i></i></div>
  </nav>

<script>
(function () {
  const samples = [
    {
      collection: "Ṣaḥīḥ al-Bukhārī",
      ref: "Book 1 · 1",
      isnad: "عَنْ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ قَالَ",
      arabic: "سَمِعْتُ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوْ إِلَى امْرَأَةٍ يَنْكِحُهَا، فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ.",
      english: "I heard the Messenger of Allah ﷺ say: Actions are only by intentions, and every person will have only what they intended. So whoever emigrated for worldly gain or for a woman to marry, his emigration was for that to which he emigrated."
    },
    {
      collection: "Ṣaḥīḥ al-Bukhārī",
      ref: "Book 1 · 2",
      isnad: "عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ رَضِيَ اللَّهُ عَنْهَا",
      arabic: "أَنَّ الْحَارِثَ بْنَ هِشَامٍ رَضِيَ اللَّهُ عَنْهُ سَأَلَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ، كَيْفَ يَأْتِيكَ الْوَحْيُ؟ فَقَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَحْيَانًا يَأْتِينِي مِثْلَ صَلْصَلَةِ الْجَرَسِ — وَهُوَ أَشَدُّهُ عَلَيَّ — فَيُفْصَمُ عَنِّي وَقَدْ وَعَيْتُ عَنْهُ مَا قَالَ، وَأَحْيَانًا يَتَمَثَّلُ لِيَ الْمَلَكُ رَجُلًا فَيُكَلِّمُنِي فَأَعِي مَا يَقُولُ.",
      english: "Al-Ḥārith ibn Hishām asked the Messenger of Allah ﷺ: “O Messenger of Allah, how does the revelation come to you?” He said: “Sometimes it comes to me like the ringing of a bell — and that is hardest on me — then it leaves me and I have retained what was said. And sometimes the angel appears to me as a man and speaks to me, and I grasp what he says.”"
    }
  ];

  let index = 0;
  let playing = false;

  const landing = document.getElementById("landing");
  const reader = document.getElementById("reader");
  const dock = document.getElementById("dock");
  const backBrand = document.getElementById("backBrand");
  const stage = document.getElementById("stage");
  const pager = document.getElementById("pager");
  const progress = document.getElementById("progress");
  const playIcon = document.getElementById("playIcon");

  samples.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot" + (i === 0 ? " on" : "");
    pager.appendChild(d);
  });

  const VIEW_FADE_MS = 450;
  const STAGE_FADE_MS = 420;

  function render(i, fade) {
    const h = samples[i];
    const apply = () => {
      document.getElementById("collection").textContent = h.collection;
      document.getElementById("ref").textContent = h.ref;
      document.getElementById("isnad").textContent = h.isnad;
      document.getElementById("arabic").textContent = h.arabic;
      document.getElementById("english").textContent = h.english;
      [...pager.children].forEach((el, n) => el.classList.toggle("on", n === i));
      stopPlay();
    };
    if (!fade) {
      apply();
      return;
    }
    stage.classList.add("is-fading");
    setTimeout(() => {
      apply();
      stage.classList.remove("is-fading");
    }, STAGE_FADE_MS);
  }

  function stopPlay() {
    playing = false;
    progress.classList.remove("is-playing");
    progress.querySelector("i").style.width = "0%";
    playIcon.innerHTML = '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>';
    document.getElementById("play").setAttribute("aria-label", "Play");
  }

  function togglePlay() {
    if (playing) {
      stopPlay();
      return;
    }
    playing = true;
    progress.classList.remove("is-playing");
    void progress.offsetWidth;
    progress.classList.add("is-playing");
    playIcon.innerHTML = '<path d="M8 6h3v12H8zm5 0h3v12h-3z" fill="currentColor" stroke="none"/>';
    document.getElementById("play").setAttribute("aria-label", "Pause");
  }

  function enterReader() {
    landing.classList.add("is-leaving");
    setTimeout(() => {
      landing.hidden = true;
      reader.hidden = false;
      dock.hidden = false;
      backBrand.hidden = false;
      requestAnimationFrame(() => {
        reader.classList.add("is-in");
        dock.classList.add("is-in");
        backBrand.classList.add("is-in");
      });
    }, VIEW_FADE_MS);
  }

  function leaveReader() {
    stopPlay();
    reader.classList.remove("is-in");
    dock.classList.remove("is-in");
    backBrand.classList.remove("is-in");
    setTimeout(() => {
      reader.hidden = true;
      dock.hidden = true;
      backBrand.hidden = true;
      landing.hidden = false;
      landing.classList.remove("is-leaving");
    }, VIEW_FADE_MS);
  }

  document.getElementById("enter").addEventListener("click", enterReader);
  backBrand.addEventListener("click", leaveReader);
  document.getElementById("prev").addEventListener("click", () => {
    index = (index - 1 + samples.length) % samples.length;
    render(index, true);
  });
  document.getElementById("next").addEventListener("click", () => {
    index = (index + 1) % samples.length;
    render(index, true);
  });
  document.getElementById("play").addEventListener("click", togglePlay);
  progress.addEventListener("animationend", stopPlay);

  // Prefer live Arabic tokens from local book JSON when available
  fetch("./bukhari/book-1.json")
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      if (!data || !data.hadith || !data.hadith.length) return;
      const take = data.hadith.slice(0, 2);
      take.forEach((row, i) => {
        if (!samples[i] || !row.tokens) return;
        const ar = row.tokens.map((t) => t.text).join(" ").replace(/\s+([،.:؛؟!»])/g, "$1");
        samples[i].arabic = ar;
        samples[i].ref = "Book 1 · " + (row.n || i + 1);
      });
      if (!reader.hidden) render(index, false);
    })
    .catch(() => {});

  render(0, false);

  // Deep-link for demos / screenshots: ?reader or #reader
  if (/[?&#]reader\b/.test(location.search + location.hash)) {
    enterReader();
  }
})();
</script>
</body>
</html>
