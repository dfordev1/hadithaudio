</head><body><main><div class="k">Sunan Abi Dawud · Book 1</div><h1>Hadith 377</h1><article class="ar" lang="ar" dir="rtl">مُسَدَّدٌ ← يَحْيَى ← ابْنِ أَبِي عَرُوبَةَ ← قَتَادَةَ ← أَبِي حَرْبِ بْنِ أَبِي الأَسْوَدِ ← أَبِيهِ ← عَلِيٍّ - رضى الله عنه - قَالَ يُغْسَلُ مِنْ بَوْلِ الْجَارِيَةِ وَيُنْضَحُ مِنْ بَوْلِ الْغُلاَمِ مَا لَمْ يَطْعَمْ .</article><a href="https://www.hadith.to/#abudawud:377">Open word-by-word reader and audio →</a></main></body></html>
