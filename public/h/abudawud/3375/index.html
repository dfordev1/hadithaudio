</head><body><main><div class="k">Sunan Abi Dawud · Book 23</div><h1>Hadith 3375</h1><article class="ar" lang="ar" dir="rtl">مُسَدَّدٌ ← حَمَّادٌ ← أَيُّوبَ ← أَبِي الزُّبَيْرِ وَسَعِيدِ بْنِ مِينَاءَ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم نَهَى عَنِ الْمُعَاوَمَةِ وَقَالَ أَحَدُهُمَا بَيْعِ السِّنِينَ .</article><a href="https://www.hadith.to/#abudawud:3375">Open word-by-word reader and audio →</a></main></body></html>
