</head><body><main><div class="k">Sunan Abi Dawud · Book 7</div><h1>Hadith 1405</h1><article class="ar" lang="ar" dir="rtl">ابْنُ السَّرْحِ ← ابْنُ وَهْبٍ ← أَبُو صَخْرٍ ← ابْنِ قُسَيْطٍ ← خَارِجَةَ بْنِ زَيْدِ بْنِ ثَابِتٍ ← أَبِيهِ ← النَّبِيِّ صلى الله عليه وسلم بِمَعْنَاهُ . قَالَ أَبُو دَاوُدَ كَانَ زَيْدٌ الإِمَامَ فَلَمْ يَسْجُدْ فِيهَا .</article><a href="https://www.hadith.to/#abudawud:1405">Open word-by-word reader and audio →</a></main></body></html>
