</head><body><main><div class="k">Sunan Abi Dawud · Book 43</div><h1>Hadith 5118</h1><article class="ar" lang="ar" dir="rtl">ابْنُ بَشَّارٍ ← أَبُو عَامِرٍ ← سُفْيَانُ ← سِمَاكِ بْنِ حَرْبٍ ← عَبْدِ الرَّحْمَنِ بْنِ عَبْدِ اللَّهِ ← أَبِيهِ انْتَهَيْتُ إِلَى النَّبِيِّ صلى الله عليه وسلم وَهُوَ فِي قُبَّةٍ مِنْ أَدَمٍ فَذَكَرَ نَحْوَهُ .</article><a href="https://www.hadith.to/#abudawud:5118">Open word-by-word reader and audio →</a></main></body></html>
