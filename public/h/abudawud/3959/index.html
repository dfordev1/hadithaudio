</head><body><main><div class="k">Sunan Abi Dawud · Book 31</div><h1>Hadith 3959</h1><article class="ar" lang="ar" dir="rtl">أَبُو كَامِلٍ ← عَبْدُ الْعَزِيزِ - يَعْنِي ابْنَ الْمُخْتَارِ - حَدَّثَنَا خَالِدٌ، عَنْ أَبِي قِلاَبَةَ، بِإِسْنَادِهِ وَمَعْنَاهُ وَلَمْ يَقُلْ فَقَالَ لَهُ قَوْلاً شَدِيدًا .</article><a href="https://www.hadith.to/#abudawud:3959">Open word-by-word reader and audio →</a></main></body></html>
