</head><body><main><div class="k">Sunan Abi Dawud · Book 43</div><h1>Hadith 4825</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ جَعْفَرٍ الْوَرْكَانِيُّ وَهَنَّادٌ، أَنَّ شَرِيكًا، أَخْبَرَهُمْ عَنْ سِمَاكٍ، عَنْ جَابِرِ بْنِ سَمُرَةَ، قَالَ كُنَّا إِذَا أَتَيْنَا النَّبِيَّ صلى الله عليه وسلم جَلَسَ أَحَدُنَا حَيْثُ يَنْتَهِي .</article><a href="https://www.hadith.to/#abudawud:4825">Open word-by-word reader and audio →</a></main></body></html>
