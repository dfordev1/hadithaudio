</head><body><main><div class="k">Sunan Abi Dawud · Book 2</div><h1>Hadith 1041</h1><article class="ar" lang="ar" dir="rtl">أَبُو الْوَلِيدِ الطَّيَالِسِيُّ ← شُعْبَةُ ← سِمَاكِ بْنِ حَرْبٍ ← قَبِيصَةَ بْنِ هُلْبٍ - رَجُلٍ مِنْ طَيِّئٍ - عَنْ أَبِيهِ، أَنَّهُ صَلَّى مَعَ النَّبِيِّ صلى الله عليه وسلم وَكَانَ يَنْصَرِفُ عَنْ شِقَّيْهِ .</article><a href="https://www.hadith.to/#abudawud:1041">Open word-by-word reader and audio →</a></main></body></html>
