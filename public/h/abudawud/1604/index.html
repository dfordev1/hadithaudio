</head><body><main><div class="k">Sunan Abi Dawud · Book 9</div><h1>Hadith 1604</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ إِسْحَاقَ الْمُسَيَّبِيُّ ← عَبْدُ اللَّهِ بْنُ نَافِعٍ ← مُحَمَّدِ بْنِ صَالِحٍ التَّمَّارِ ← ابْنِ شِهَابٍ بِإِسْنَادِهِ وَمَعْنَاهُ . قَالَ أَبُو دَاوُدَ وَسَعِيدٌ لَمْ يَسْمَعْ مِنْ عَتَّابٍ شَيْئًا .</article><a href="https://www.hadith.to/#abudawud:1604">Open word-by-word reader and audio →</a></main></body></html>
