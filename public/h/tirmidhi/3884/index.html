</head><body><main><div class="k">Jami at-Tirmidhi · Book 49</div><h1>Hadith 3884</h1><article class="ar" lang="ar" dir="rtl">الْقَاسِمُ بْنُ دِينَارٍ الْكُوفِيُّ ← مُعَاوِيَةُ بْنُ عَمْرٍو ← زَائِدَةَ ← عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ ← مُوسَى بْنِ طَلْحَةَ مَا رَأَيْتُ أَحَدًا أَفْصَحَ مِنْ عَائِشَةَ . هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ .</article><a href="https://www.hadith.to/#tirmidhi:3884">Open word-by-word reader and audio →</a></main></body></html>
