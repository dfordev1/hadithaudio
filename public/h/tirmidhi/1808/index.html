</head><body><main><div class="k">Jami at-Tirmidhi · Book 25</div><h1>Hadith 1808</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ مَدُّويَهْ ← مُسَدَّدٌ ← الْجَرَّاحُ بْنُ مَلِيحٍ وَالِدُ، وَكِيعٍ، عَنْ أَبِي إِسْحَاقَ، عَنْ شَرِيكِ بْنِ حَنْبَلٍ، عَنْ عَلِيٍّ، أَنَّهُ قَالَ نُهِيَ عَنْ أَكْلِ الثُّومِ، إِلاَّ مَطْبُوخًا .</article><a href="https://www.hadith.to/#tirmidhi:1808">Open word-by-word reader and audio →</a></main></body></html>
