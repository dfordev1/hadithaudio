</head><body><main><div class="k">Sunan Ibn Majah · Book 12</div><h1>Hadith 2164</h1><article class="ar" lang="ar" dir="rtl">عَبْدُ الْحَمِيدِ بْنُ بَيَانٍ الْوَاسِطِيُّ ← خَالِدُ بْنُ عَبْدِ اللَّهِ ← يُونُسَ ← ابْنِ سِيرِينَ ← أَنَسِ بْنِ مَالِكٍ ← النَّبِيَّ ـ صلى الله عليه وسلم احْتَجَمَ وَأَعْطَى الْحَجَّامَ أَجْرَهُ .</article><a href="https://www.hadith.to/#ibnmajah:2164">Open word-by-word reader and audio →</a></main></body></html>
