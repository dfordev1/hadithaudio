</head><body><main><div class="k">Sunan Ibn Majah · Book 20</div><h1>Hadith 2535</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ الصَّبَّاحِ أَنْبَأَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ أَيُّوبَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم (مَنْ بَدَّلَ دِينَهُ فَاقْتُلُوهُ ).</article><a href="https://www.hadith.to/#ibnmajah:2535">Open word-by-word reader and audio →</a></main></body></html>
