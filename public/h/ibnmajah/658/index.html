</head><body><main><div class="k">Sunan Ibn Majah · Book 1</div><h1>Hadith 658</h1><article class="ar" lang="ar" dir="rtl">عَلِيُّ بْنُ مُحَمَّدٍ ← وَكِيعٌ ← حَمَّادِ بْنِ سَلَمَةَ ← مُحَمَّدِ بْنِ زِيَادٍ ← أَبِي هُرَيْرَةَ رَأَيْتُ النَّبِيَّ ـ صلى الله عليه وسلم ـ حَامِلَ الْحُسَيْنِ بْنِ عَلِيٍّ عَلَى عَاتِقِهِ وَلُعَابُهُ يَسِيلُ عَلَيْهِ .</article><a href="https://www.hadith.to/#ibnmajah:658">Open word-by-word reader and audio →</a></main></body></html>
