</head><body><main><div class="k">Sunan Ibn Majah · Book 4</div><h1>Hadith 751</h1><article class="ar" lang="ar" dir="rtl">إِسْحَاقُ بْنُ مَنْصُورٍ ← عَبْدُ اللَّهِ بْنُ نُمَيْرٍ أَنْبَأَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ كُنَّا نَنَامُ فِي الْمَسْجِدِ عَلَى عَهْدِ رَسُولِ اللَّهِ ـ صلى الله عليه وسلم ـ .</article><a href="https://www.hadith.to/#ibnmajah:751">Open word-by-word reader and audio →</a></main></body></html>
