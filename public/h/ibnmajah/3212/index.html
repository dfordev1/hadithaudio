</head><body><main><div class="k">Sunan Ibn Majah · Book 28</div><h1>Hadith 3212</h1><article class="ar" lang="ar" dir="rtl">عَلِيُّ بْنُ الْمُنْذِرِ ← مُحَمَّدُ بْنُ فُضَيْلٍ ← مُجَالِدُ بْنُ سَعِيدٍ ← عَامِرٍ ← عَدِيِّ بْنِ حَاتِمٍ قُلْتُ يَا رَسُولَ اللَّهِ إِنَّا قَوْمٌ نَرْمِي . قَالَ &quot; إِذَا رَمَيْتَ وَخَزَقْتَ فَكُلْ مَا خَزَقْتَ &quot; .</article><a href="https://www.hadith.to/#ibnmajah:3212">Open word-by-word reader and audio →</a></main></body></html>
