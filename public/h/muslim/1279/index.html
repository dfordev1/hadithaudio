</head><body><main><div class="k">Sahih Muslim · Book 5</div><h1>Hadith 1279</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ يَحْيَى بْنُ يَحْيَى، أَخ وَحَدَّثَنَاهُ يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا فُضَيْلُ بْنُ عِيَاضٍ، عَنْ مَنْصُورٍ، بِهَذَا الإِسْنَادِ وَقَالَ ‏ &quot;‏ فَلْيَتَحَرَّ الَّذِي يُرَى أَنَّهُ الصَّوَابُ ‏&quot;‏ ‏.‏</article><a href="https://www.hadith.to/#muslim:1279">Open word-by-word reader and audio →</a></main></body></html>
