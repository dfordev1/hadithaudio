</head><body><main><div class="k">Sahih Muslim · Book 28</div><h1>Hadith 4367</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ الْمُثَنَّى وَابْنُ، بَشَّارٍ قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ عَطَاءٍ، عَنِ ابْنِ يَعْلَى، عَنْ يَعْلَى، عَنِ النَّبِيِّ صلى الله عليه وسلم بِمِثْلِهِ .</article><a href="https://www.hadith.to/#muslim:4367">Open word-by-word reader and audio →</a></main></body></html>
