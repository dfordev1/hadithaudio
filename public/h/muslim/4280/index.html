</head><body><main><div class="k">Sahih Muslim · Book 27</div><h1>Hadith 4280</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ حَاتِمٍ ← بَهْزٌ ← شُعْبَةُ ← سِمَاكُ بْنُ حَرْبٍ سَمِعْتُ تَمِيمَ بْنَ طَرَفَةَ، قَالَ سَمِعْتُ عَدِيَّ بْنَ حَاتِمٍ، أَنَّ رَجُلاً، سَأَلَهُ فَذَكَرَ مِثْلَهُ وَزَادَ وَلَكَ أَرْبَعُمِائَةٍ فِي عَطَائِي .</article><a href="https://www.hadith.to/#muslim:4280">Open word-by-word reader and audio →</a></main></body></html>
