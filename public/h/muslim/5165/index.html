</head><body><main><div class="k">Sahih Muslim · Book 36</div><h1>Hadith 5165</h1><article class="ar" lang="ar" dir="rtl">أَبُو بَكْرِ بْنُ إِسْحَاقَ ← رَوْحٌ ← ابْنُ جُرَيْجٍ ← مُوسَى بْنُ عُقْبَةَ عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّهُ قَالَ قَدْ نُهِيَ أَنْ يُنْبَذَ الْبُسْرُ وَالرُّطَبُ جَمِيعًا وَالتَّمْرُ وَالزَّبِيبُ جَمِيعًا .</article><a href="https://www.hadith.to/#muslim:5165">Open word-by-word reader and audio →</a></main></body></html>
