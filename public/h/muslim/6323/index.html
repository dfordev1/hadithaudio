</head><body><main><div class="k">Sahih Muslim · Book 44</div><h1>Hadith 6323</h1><article class="ar" lang="ar" dir="rtl">أَحْمَدُ بْنُ الْحَسَنِ بْنِ خِرَاشٍ ← عَمْرُو بْنُ عَاصِمٍ ← سُلَيْمَانُ بْنُ الْمُغِيرَةِ حَدَّثَنَا ثَابِتٌ، حَدَّثَنِي أَنَسُ بْنُ مَالِكٍ، قَالَ مَاتَ ابْنٌ لأَبِي طَلْحَةَ . وَاقْتَصَّ الْحَدِيثَ بِمِثْلِهِ .</article><a href="https://www.hadith.to/#muslim:6323">Open word-by-word reader and audio →</a></main></body></html>
