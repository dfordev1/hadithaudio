</head><body><main><div class="k">Sahih Muslim · Book 4</div><h1>Hadith 1052</h1><article class="ar" lang="ar" dir="rtl">خَلَفُ بْنُ هِشَامٍ وَأَبُو الرَّبِيعِ الزَّهْرَانِيُّ، قَالاَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ عَبْدِ الْعَزِيزِ بْنِ صُهَيْبٍ، عَنْ أَنَسٍ، أَنَّ النَّبِيَّ صلى الله عليه وسلم كَانَ يُوجِزُ فِي الصَّلاَةِ وَيُتِمُّ .</article><a href="https://www.hadith.to/#muslim:1052">Open word-by-word reader and audio →</a></main></body></html>
