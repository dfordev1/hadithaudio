</head><body><main><div class="k">Sahih Muslim · Book 28</div><h1>Hadith 4360</h1><article class="ar" lang="ar" dir="rtl">الْفَضْلُ بْنُ سَهْلٍ الأَعْرَجُ ← يَحْيَى بْنُ غَيْلاَنَ ← يَزِيدُ بْنُ زُرَيْعٍ ← سُلَيْمَانَ التَّيْمِيِّ ← أَنَسٍ إِنَّمَا سَمَلَ النَّبِيُّ صلى الله عليه وسلم أَعْيُنَ أُولَئِكَ لأَنَّهُمْ سَمَلُوا أَعْيُنَ الرِّعَاءِ .</article><a href="https://www.hadith.to/#muslim:4360">Open word-by-word reader and audio →</a></main></body></html>
