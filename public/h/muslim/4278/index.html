</head><body><main><div class="k">Sahih Muslim · Book 27</div><h1>Hadith 4278</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ طَرِيفٍ ← مُحَمَّدُ بْنُ فُضَيْلٍ ← الشَّيْبَانِيِّ ← عَبْدِ الْعَزِيزِ بْنِ رُفَيْعٍ عَنْ تَمِيمٍ الطَّائِيِّ، عَنْ عَدِيِّ بْنِ حَاتِمٍ، أَنَّهُ سَمِعَ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ذَلِكَ .</article><a href="https://www.hadith.to/#muslim:4278">Open word-by-word reader and audio →</a></main></body></html>
