</head><body><main><div class="k">Sahih Muslim · Book 4</div><h1>Hadith 925</h1><article class="ar" lang="ar" dir="rtl">عَبْدُ بْنُ حُمَيْدٍ ← عَبْدُ الرَّزَّاقِ ← مَعْمَرٌ ← الزُّهْرِيِّ ← أَنَسٌ أَنَّ النَّبِيَّ صلى الله عليه وسلم سَقَطَ مِنْ فَرَسِهِ فَجُحِشَ شِقُّهُ الأَيْمَنُ . وَسَاقَ الْحَدِيثَ وَلَيْسَ فِيهِ زِيَادَةُ يُونُسَ وَمَالِكٍ .</article><a href="https://www.hadith.to/#muslim:925">Open word-by-word reader and audio →</a></main></body></html>
