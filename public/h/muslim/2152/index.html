</head><body><main><div class="k">Sahih Muslim · Book 11</div><h1>Hadith 2152</h1><article class="ar" lang="ar" dir="rtl">حَرْمَلَةُ بْنُ يَحْيَى ← عَبْدُ اللَّهِ بْنُ وَهْبٍ ← عُمَرُ بْنُ مُحَمَّدٍ أَنَّحَدَّثَهُ عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ &quot; إِنَّ الْمَيِّتَ يُعَذَّبُ بِبُكَاءِ الْحَىِّ &quot; .</article><a href="https://www.hadith.to/#muslim:2152">Open word-by-word reader and audio →</a></main></body></html>
