</head><body><main><div class="k">Sahih Muslim · Book 44</div><h1>Hadith 6205</h1><article class="ar" lang="ar" dir="rtl">قُتَيْبَةُ بْنُ سَعِيدٍ ← لَيْثٌ ح وَحَدَّثَنَا عَمْرٌو النَّاقِدُ، وَزُهَيْرُ بْنُ حَرْبٍ، قَالاَ حَدَّثَنَا ابْنُ عُيَيْنَةَ، كِلاَهُمَا عَنِ ابْنِ عَجْلاَنَ، عَنْ سَعْدِ بْنِ إِبْرَاهِيمَ، بِهَذَا الإِسْنَادِ مِثْلَهُ .</article><a href="https://www.hadith.to/#muslim:6205">Open word-by-word reader and audio →</a></main></body></html>
