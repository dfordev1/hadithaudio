</head><body><main><div class="k">Sahih Muslim · Book 13</div><h1>Hadith 2762</h1><article class="ar" lang="ar" dir="rtl">يَحْيَى بْنُ يَحْيَى قَرَأْتُ عَلَى مَالِكٍ عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنِ ابْنِ، عُمَرَ - رضى الله عنهما - عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ &quot; تَحَرَّوْا لَيْلَةَ الْقَدْرِ فِي السَّبْعِ الأَوَاخِرِ &quot; .</article><a href="https://www.hadith.to/#muslim:2762">Open word-by-word reader and audio →</a></main></body></html>
