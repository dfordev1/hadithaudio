</head><body><main><div class="k">Sahih Muslim · Book 37</div><h1>Hadith 5576</h1><article class="ar" lang="ar" dir="rtl">شَيْبَانُ بْنُ فَرُّوخَ ← جَرِيرٌ - يَعْنِي ابْنَ حَازِمٍ - حَدَّثَنَا الأَعْمَشُ، عَنْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنْ عَبْدِ اللَّهِ، عَنِ النَّبِيِّ صلى الله عليه وسلم بِنَحْوِ حَدِيثِهِمْ .</article><a href="https://www.hadith.to/#muslim:5576">Open word-by-word reader and audio →</a></main></body></html>
