</head><body><main><div class="k">Sahih Muslim · Book 12</div><h1>Hadith 2264</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ رُمْحِ بْنِ الْمُهَاجِرِ ← اللَّيْثُ ح وَحَدَّثَنِي عَمْرٌو النَّاقِدُ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ إِدْرِيسَ، كِلاَهُمَا عَنْ يَحْيَى بْنِ سَعِيدٍ، عَنْ عَمْرِو بْنِ يَحْيَى، بِهَذَا الإِسْنَادِ . مِثْلَهُ.</article><a href="https://www.hadith.to/#muslim:2264">Open word-by-word reader and audio →</a></main></body></html>
