</head><body><main><div class="k">Sahih Muslim · Book 29</div><h1>Hadith 4456</h1><article class="ar" lang="ar" dir="rtl">أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ ← وَكِيعٌ ← هِشَامٍ ← قَتَادَةَ ← أَنَسٍ أَنَّوسلم كَانَ يَضْرِبُ فِي الْخَمْرِ بِالنِّعَالِ وَالْجَرِيدِ أَرْبَعِينَ . ثُمَّ ذَكَرَ نَحْوَ حَدِيثِهِمَا وَلَمْ يَذْكُرِ الرِّيفَ وَالْقُرَى .</article><a href="https://www.hadith.to/#muslim:4456">Open word-by-word reader and audio →</a></main></body></html>
