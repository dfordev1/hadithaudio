</head><body><main><div class="k">Sahih Muslim · Book 3</div><h1>Hadith 777</h1><article class="ar" lang="ar" dir="rtl">عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ الْعَنْبَرِيُّ ← الْمُعْتَمِرُ ← أَبِي ← أَبُو الْعَلاَءِ بْنُ الشِّخِّيرِ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَنْسَخُ حَدِيثُهُ بَعْضُهُ بَعْضًا كَمَا يَنْسَخُ الْقُرْآنُ بَعْضُهُ بَعْضًا .</article><a href="https://www.hadith.to/#muslim:777">Open word-by-word reader and audio →</a></main></body></html>
