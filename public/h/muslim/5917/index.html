</head><body><main><div class="k">Sahih Muslim · Book 42</div><h1>Hadith 5917</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ ابْنُ الْمُثَنَّى، وَعُبَ وَحَدَّثَنَاهُ ابْنُ الْمُثَنَّى، وَعُبَيْدُ اللَّهِ بْنُ سَعِيدٍ، قَالاَ حَدَّثَنَا يَحْيَى، عَنْ عُبَيْدِ اللَّهِ، بِهَذَا الإِسْنَادِ ‏.‏</article><a href="https://www.hadith.to/#muslim:5917">Open word-by-word reader and audio →</a></main></body></html>
