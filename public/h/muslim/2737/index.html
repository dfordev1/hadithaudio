</head><body><main><div class="k">Sahih Muslim · Book 13</div><h1>Hadith 2737</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَ وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَا ابْنُ بِشْرٍ، عَنْ مِسْعَرٍ، حَدَّثَنَا حَبِيبُ بْنُ أَبِي ثَابِتٍ، بِهَذَا الإِسْنَادِ وَقَالَ ‏ &quot;‏ وَنَفِهَتِ النَّفْسُ ‏&quot;‏ ‏.‏</article><a href="https://www.hadith.to/#muslim:2737">Open word-by-word reader and audio →</a></main></body></html>
