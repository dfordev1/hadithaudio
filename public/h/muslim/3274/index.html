</head><body><main><div class="k">Sahih Muslim · Book 15</div><h1>Hadith 3274</h1><article class="ar" lang="ar" dir="rtl">ابْنُ أَبِي عُمَرَ ← هِشَامٌ - يَعْنِي ابْنَ سُلَيْمَانَ - الْمَخْزُومِيُّ عَنِ ابْنِ، جُرَيْجٍ بِهَذَا الإِسْنَادِ نَحْوَهُ وَلَمْ يَذْكُرْ &quot; لاَ يَخْلُوَنَّ رَجُلٌ بِامْرَأَةٍ إِلاَّ وَمَعَهَا ذُو مَحْرَمٍ &quot; .</article><a href="https://www.hadith.to/#muslim:3274">Open word-by-word reader and audio →</a></main></body></html>
