</head><body><main><div class="k">Sahih Muslim · Book 33</div><h1>Hadith 4839</h1><article class="ar" lang="ar" dir="rtl">يَحْيَى بْنُ يَحْيَى قَرَأْتُ عَلَى مَالِكٍ عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ، قَالَ نَهَى رَسُولُ اللَّهِ صلى الله عليه وسلم أَنْ يُسَافَرَ بِالْقُرْآنِ إِلَى أَرْضِ الْعَدُوِّ .</article><a href="https://www.hadith.to/#muslim:4839">Open word-by-word reader and audio →</a></main></body></html>
