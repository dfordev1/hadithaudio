</head><body><main><div class="k">Sahih Muslim · Book 5</div><h1>Hadith 1316</h1><article class="ar" lang="ar" dir="rtl">زُهَيْرُ بْنُ حَرْبٍ ← سُفْيَانُ بْنُ عُيَيْنَةَ ← عَمْرٍو ← بِذَا أَبُو مَعْبَدٍ - ثُمَّ أَنْكَرَهُ بَعْدُ - عَنِ ابْنِ عَبَّاسٍ، قَالَ كُنَّا نَعْرِفُ انْقِضَاءَ صَلاَةِ رَسُولِ اللَّهِ صلى الله عليه وسلم بِالتَّكْبِيرِ .</article><a href="https://www.hadith.to/#muslim:1316">Open word-by-word reader and audio →</a></main></body></html>
