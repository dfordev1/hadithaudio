</head><body><main><div class="k">Sahih Muslim · Book 18</div><h1>Hadith 3706</h1><article class="ar" lang="ar" dir="rtl">يَحْيَى بْنُ يَحْيَى ← هُشَيْمٌ ← حُصَيْنٍ وَدَاوُدَ، وَمُغِيرَةَ، وَإِسْمَاعِيلَ، وَأَشْعَثَ عَنِ الشَّعْبِيِّ، أَنَّهُ قَالَ دَخَلْتُ عَلَى فَاطِمَةَ بِنْتِ قَيْسٍ . بِمِثْلِ حَدِيثِ زُهَيْرٍ عَنْ هُشَيْمٍ</article><a href="https://www.hadith.to/#muslim:3706">Open word-by-word reader and audio →</a></main></body></html>
