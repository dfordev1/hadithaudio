</head><body><main><div class="k">Sahih Muslim · Book 40</div><h1>Hadith 5865</h1><article class="ar" lang="ar" dir="rtl">قُتَيْبَةُ ← الْمُغِيرَةُ بْنُ عَبْدِ الرَّحْمَنِ ← أَبِي الزِّنَادِ ← الأَعْرَجِ ← أَبِي هُرَيْرَةَ ← رَسُولَ اللَّهِ صلى الله عليه وسلم &quot; لاَ يَقُولَنَّ أَحَدُكُمْ يَا خَيْبَةَ الدَّهْرِ . فَإِنَّ اللَّهَ هُوَ الدَّهْرُ &quot; .</article><a href="https://www.hadith.to/#muslim:5865">Open word-by-word reader and audio →</a></main></body></html>
