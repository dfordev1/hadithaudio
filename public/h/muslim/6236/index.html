</head><body><main><div class="k">Sahih Muslim · Book 44</div><h1>Hadith 6236</h1><article class="ar" lang="ar" dir="rtl">قُتَيْبَةُ بْنُ سَعِيدٍ وَابْنُ، رُمْحٍ عَنِ اللَّيْثِ بْنِ سَعْدٍ، ح وَحَدَّثَنَا ابْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الْوَهَّابِ، كِلاَهُمَا عَنْ يَحْيَى بْنِ سَعِيدٍ، بِهَذَا الإِسْنَادِ .</article><a href="https://www.hadith.to/#muslim:6236">Open word-by-word reader and audio →</a></main></body></html>
