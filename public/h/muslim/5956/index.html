</head><body><main><div class="k">Sahih Muslim · Book 43</div><h1>Hadith 5956</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ عَمْرٌو النَّاقِدُ، وَابْ وَحَدَّثَنَاهُ عَمْرٌو النَّاقِدُ، وَابْنُ أَبِي عُمَرَ، قَالاَ حَدَّثَنَا سُفْيَانُ، عَنْ أَبِي الزِّنَادِ، بِهَذَا الإِسْنَادِ نَحْوَهُ ‏.‏</article><a href="https://www.hadith.to/#muslim:5956">Open word-by-word reader and audio →</a></main></body></html>
