</head><body><main><div class="k">Sahih Muslim · Book 55</div><h1>Hadith 7467</h1><article class="ar" lang="ar" dir="rtl">إِسْحَاقُ بْنُ مُوسَى الأَنْصَارِيُّ ← أَنَسُ بْنُ عِيَاضٍ ← عُبَيْدُ اللَّهِ بِهَذَا الإِسْنَادِ . مِثْلَهُ غَيْرَ أَنَّهُ قَالَ فَاسْتَقَوْا مِنْ بِئَارِهَا وَاعْتَجَنُوا بِهِ .</article><a href="https://www.hadith.to/#muslim:7467">Open word-by-word reader and audio →</a></main></body></html>
