</head><body><main><div class="k">Sahih Muslim · Book 30</div><h1>Hadith 4482</h1><article class="ar" lang="ar" dir="rtl">شَيْبَانُ بْنُ فَرُّوخَ ← أَبُو عَوَانَةَ ← سُهَيْلٍ بِهَذَا الإِسْنَادِ . مِثْلَهُ غَيْرَ أَنَّهُ قَالَ وَيَسْخَطُ لَكُمْ ثَلاَثًا . وَلَمْ يَذْكُرْ وَلاَ تَفَرَّقُوا .</article><a href="https://www.hadith.to/#muslim:4482">Open word-by-word reader and audio →</a></main></body></html>
