</head><body><main><div class="k">Sahih Muslim · Book 8</div><h1>Hadith 2062</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ يَحْيَى بْنُ يَحْيَى، وَأ وَحَدَّثَنَاهُ يَحْيَى بْنُ يَحْيَى، وَأَبُو كُرَيْبٍ جَمِيعًا عَنْ أَبِي مُعَاوِيَةَ، عَنْ هِشَامٍ، بِهَذَا الإِسْنَادِ ‏.‏ وَفِيهِ جَارِيَتَانِ تَلْعَبَانِ بِدُفٍّ ‏.‏</article><a href="https://www.hadith.to/#muslim:2062">Open word-by-word reader and audio →</a></main></body></html>
