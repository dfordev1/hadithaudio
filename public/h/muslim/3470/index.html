</head><body><main><div class="k">Sahih Muslim · Book 16</div><h1>Hadith 3470</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَ وَحَدَّثَنَاهُ أَبُو كُرَيْبٍ، حَدَّثَنَا عَبْدَةُ، عَنْ عُبَيْدِ اللَّهِ، - وَهُوَ ابْنُ عُمَرَ - بِهَذَا الإِسْنَادِ وَلَمْ يَذْكُرْ زِيَادَةَ ابْنِ نُمَيْرٍ ‏.‏</article><a href="https://www.hadith.to/#muslim:3470">Open word-by-word reader and audio →</a></main></body></html>
