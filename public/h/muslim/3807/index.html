</head><body><main><div class="k">Sahih Muslim · Book 21</div><h1>Hadith 3807</h1><article class="ar" lang="ar" dir="rtl">وَحَدَّثَنِيهِ عَمْرٌو النَّاقِدُ، حَدَّ وَحَدَّثَنِيهِ عَمْرٌو النَّاقِدُ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ بْنِ سَعْدٍ، حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، بِهَذَا الإِسْنَادِ ‏.‏</article><a href="https://www.hadith.to/#muslim:3807">Open word-by-word reader and audio →</a></main></body></html>
