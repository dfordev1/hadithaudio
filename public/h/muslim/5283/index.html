</head><body><main><div class="k">Sahih Muslim · Book 36</div><h1>Hadith 5283</h1><article class="ar" lang="ar" dir="rtl">عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ ← أَبِي ← شُعْبَةُ ← عَاصِمٍ سَمِعَ الشَّعْبِيَّ، سَمِعَ ابْنَ عَبَّاسٍ، قَالَ سَقَيْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم مِنْ زَمْزَمَ فَشَرِبَ قَائِمًا وَاسْتَسْقَى وَهُوَ عِنْدَ الْبَيْتِ .</article><a href="https://www.hadith.to/#muslim:5283">Open word-by-word reader and audio →</a></main></body></html>
