</head><body><main><div class="k">Sahih al-Bukhari · Book 86</div><h1>Hadith 6790</h1><article class="ar" lang="ar" dir="rtl">إِسْمَاعِيلُ بْنُ أَبِي أُوَيْسٍ ← ابْنِ وَهْبٍ ← يُونُسَ ← ابْنِ شِهَابٍ ← عُرْوَةَ بْنِ الزُّبَيْرِ وَعَمْرَةَ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ &quot; تُقْطَعُ يَدُ السَّارِقِ فِي رُبُعِ دِينَارٍ &quot;.</article><a href="https://www.hadith.to/#bukhari:6790">Open word-by-word reader and audio →</a></main></body></html>
