</head><body><main><div class="k">Sahih al-Bukhari · Book 2</div><h1>Hadith 48</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ عَرْعَرَةَ ← شُعْبَةُ ← زُبَيْدٍ سَأَلْتُ أَبَا وَائِلٍ عَنِ الْمُرْجِئَةِ،، فَقَالَ حَدَّثَنِي عَبْدُ اللَّهِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ &quot; سِبَابُ الْمُسْلِمِ فُسُوقٌ، وَقِتَالُهُ كُفْرٌ &quot;.</article><a href="https://www.hadith.to/#bukhari:48">Open word-by-word reader and audio →</a></main></body></html>
