</head><body><main><div class="k">Sahih al-Bukhari · Book 85</div><h1>Hadith 6761</h1><article class="ar" lang="ar" dir="rtl">آدَمُ ← شُعْبَةُ ← مُعَاوِيَةُ بْنُ قُرَّةَ وَقَتَادَةُ، عَنْ أَنَسِ بْنِ مَالِكٍ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ &quot; مَوْلَى الْقَوْمِ مِنْ أَنْفُسِهِمْ &quot;. أَوْ كَمَا قَالَ.</article><a href="https://www.hadith.to/#bukhari:6761">Open word-by-word reader and audio →</a></main></body></html>
