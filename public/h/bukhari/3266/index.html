</head><body><main><div class="k">Sahih al-Bukhari · Book 59</div><h1>Hadith 3266</h1><article class="ar" lang="ar" dir="rtl">قُتَيْبَةُ بْنُ سَعِيدٍ ← سُفْيَانُ ← عَمْرٍو سَمِعَ عَطَاءً، يُخْبِرُ عَنْ صَفْوَانَ بْنِ يَعْلَى، عَنْ أَبِيهِ، أَنَّهُ سَمِعَ النَّبِيَّ صلى الله عليه وسلم يَقْرَأُ عَلَى الْمِنْبَرِ {وَنَادَوْا يَا مَالِكُ }.</article><a href="https://www.hadith.to/#bukhari:3266">Open word-by-word reader and audio →</a></main></body></html>
