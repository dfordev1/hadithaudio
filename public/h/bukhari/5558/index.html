</head><body><main><div class="k">Sahih al-Bukhari · Book 73</div><h1>Hadith 5558</h1><article class="ar" lang="ar" dir="rtl">آدَمُ بْنُ أَبِي إِيَاسٍ ← شُعْبَةُ ← قَتَادَةُ ← أَنَسٍ ضَحَّى النَّبِيُّ صلى الله عليه وسلم بِكَبْشَيْنِ أَمْلَحَيْنِ، فَرَأَيْتُهُ وَاضِعًا قَدَمَهُ عَلَى صِفَاحِهِمَا يُسَمِّي وَيُكَبِّرُ، فَذَبَحَهُمَا بِيَدِهِ.</article><a href="https://www.hadith.to/#bukhari:5558">Open word-by-word reader and audio →</a></main></body></html>
