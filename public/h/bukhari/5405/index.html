</head><body><main><div class="k">Sahih al-Bukhari · Book 70</div><h1>Hadith 5405</h1><article class="ar" lang="ar" dir="rtl">وَعَنْ أَيُّوبَ، وَعَاصِمٍ، عَنْ عِكْرِم وَعَنْ أَيُّوبَ، وَعَاصِمٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، قَالَ انْتَشَلَ النَّبِيُّ صلى الله عليه وسلم عَرْقًا مِنْ قِدْرٍ فَأَكَلَ، ثُمَّ صَلَّى، وَلَمْ يَتَوَضَّأْ‏.‏</article><a href="https://www.hadith.to/#bukhari:5405">Open word-by-word reader and audio →</a></main></body></html>
