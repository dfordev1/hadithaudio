</head><body><main><div class="k">Sahih al-Bukhari · Book 8</div><h1>Hadith 449</h1><article class="ar" lang="ar" dir="rtl">خَلاَّدٌ ← عَبْدُ الْوَاحِدِ بْنُ أَيْمَنَ ← أَبِيهِ ← جَابِرٍ ← امْرَأَةً تْ يَا رَسُولَ اللَّهِ، أَلاَ أَجْعَلُ لَكَ شَيْئًا تَقْعُدُ عَلَيْهِ، فَإِنَّ لِي غُلاَمًا نَجَّارًا قَالَ &quot; إِنْ شِئْتِ &quot;. فَعَمِلَتِ الْمِنْبَرَ.</article><a href="https://www.hadith.to/#bukhari:449">Open word-by-word reader and audio →</a></main></body></html>
