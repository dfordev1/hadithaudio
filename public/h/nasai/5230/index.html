</head><body><main><div class="k">Sunan an-Nasa&#x27;i · Book 48</div><h1>Hadith 5230</h1><article class="ar" lang="ar" dir="rtl">إِسْحَاقُ بْنُ إِبْرَاهِيمَ أَنْبَأَنَا مُحَمَّدُ بْنُ بِشْرٍ، قَالَ حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنْ عُمَرَ بْنِ نَافِعٍ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ نَهَى رَسُولُ اللَّهِ صلى الله عليه وسلم عَنِ الْقَزَعِ .</article><a href="https://www.hadith.to/#nasai:5230">Open word-by-word reader and audio →</a></main></body></html>
