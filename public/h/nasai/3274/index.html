</head><body><main><div class="k">Sunan an-Nasa&#x27;i · Book 26</div><h1>Hadith 3274</h1><article class="ar" lang="ar" dir="rtl">أَحْمَدُ بْنُ نَصْرٍ ← عُبَيْدُ اللَّهِ - وَهُوَ ابْنُ مُوسَى - عَنِ ابْنِ جُرَيْجٍ، عَنْ عَطَاءٍ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم تَزَوَّجَ مَيْمُونَةَ وَهُوَ مُحْرِمٌ .</article><a href="https://www.hadith.to/#nasai:3274">Open word-by-word reader and audio →</a></main></body></html>
