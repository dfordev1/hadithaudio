</head><body><main><div class="k">Sunan an-Nasa&#x27;i · Book 22</div><h1>Hadith 2273</h1><article class="ar" lang="ar" dir="rtl">مُحَمَّدُ بْنُ الْمُثَنَّى ← عُثْمَانُ بْنُ عُمَرَ أَنْبَأَنَا عَلِيٌّ، عَنْ يَحْيَى، عَنْ أَبِي قِلاَبَةَ، عَنْ رَجُلٍ، أَنَّ أَبَا أُمَيَّةَ، أَخْبَرَهُ أَنَّهُ، أَتَى النَّبِيَّ صلى الله عليه وسلم مِنْ سَفَرٍ نَحْوَهُ .</article><a href="https://www.hadith.to/#nasai:2273">Open word-by-word reader and audio →</a></main></body></html>
