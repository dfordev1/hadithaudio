<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahih Ibn Khuzaymah · Hadith.to</title><style>body{max-width:45rem;margin:auto;padding:2rem 1rem;background:#eef1f3;color:#192026;font:1.1rem/1.6 Georgia,serif}a{color:inherit}select,audio{max-width:100%}article[lang]{font:2rem/2.1 serif}nav{display:flex;gap:1rem;align-items:center}button,select{padding:.5rem}</style><a href="/">← All collections</a><h1>Sahih Ibn Khuzaymah</h1><nav><button id="prev" disabled>Previous</button><select id="pick" aria-label="Hadith number"></select><button id="next" disabled>Next</button></nav><p id="msg" role="status">Loading hadith…</p><h2 id="chapter" lang="ar" dir="rtl"></h2><article id="arabic" lang="ar" dir="rtl"></article><p id="meaning"></p><audio id="player" controls preload="none" hidden></audio><footer><a href="https://rawy.net/book/10028">Recitation from Rawy Library</a></footer><script>
(async()=>{
 const el=id=>document.getElementById(id), pick=el('pick'), player=el('player');
 const response=await fetch('/ibn-khuzaymah/records.gz');
 if(!response.ok) throw Error('data');
 const rows=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json();
 for(const [n] of rows) pick.add(new Option('Hadith '+n,n));
 function show(){
  const i=Math.max(0,rows.findIndex(row=>row[0]===location.hash.slice(1)));
  const [n,title,chain,body,en,audio]=rows[i];pick.selectedIndex=i;
  el('prev').disabled=i===0;el('next').disabled=i===rows.length-1;
  el('chapter').textContent=title;el('arabic').textContent=[chain,body].filter(Boolean).join(' ');
  el('meaning').textContent=en;el('msg').textContent=audio?'':'No recitation for this hadith.';
  player.pause();player.removeAttribute('src');player.hidden=!audio;
  if(audio)player.src=audio[0]+'#t='+audio[1]+','+audio[2];
  player.load();
 }
 pick.onchange=()=>location.hash=pick.value;
 el('prev').onclick=()=>location.hash=rows[pick.selectedIndex-1][0];
 el('next').onclick=()=>location.hash=rows[pick.selectedIndex+1][0];
 player.onerror=()=>{if(player.hasAttribute('src'))el('msg').textContent='Recitation unavailable.'};
 addEventListener('hashchange',show);show();
})().catch(()=>document.getElementById('msg').textContent='Unable to load the collection.');
</script></html>
