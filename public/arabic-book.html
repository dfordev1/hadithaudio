<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكتب المسموعة | Hadith.to</title>
<link rel="stylesheet" href="/reader-ui.css?v=arabic-search-snippets">
<style>
  :root {
    --bg:#eef1f3; --bg-deep:#e3e8ec; --ink:#10131a; --ink-soft:#2a3038;
    --muted:#5c646e; --faint:#8a929c;
    --line:#c5cbc8; --soft:#e6eaed; --rule:#c5cbc8;
    --gold:#9a8450; --gold-soft:rgba(154,132,80,.35);
    --hl-bg:rgba(16,19,26,.036); --hl-ink:var(--ink);
    --dock:rgba(238,241,240,.92);
    --ar-font:"Scheherazade New",Scheherazade,"Traditional Arabic",serif;
    --ui-font:"Source Serif 4","Source Serif Pro",Georgia,serif;
    --ease:ease-in-out;
    --ease-quick:ease;
    --dur-fade:420ms;
    --dur-highlight:260ms;
    --dur-view:450ms;
    --ar-size:2.1rem; --en-size:1.05rem; --en-gloss-size:0.72rem; --ur-size:0.8rem; --en-lh:1.75; --ar-lh:2.35; --ur-lh:1.9; --wbw-gap:18px; --word-pad:6px;
    --header-h:48px; --loc-h:44px;
  }
  :root[data-theme="dark"] {
    --bg:#12161c; --bg-deep:#0e1217; --ink:#e8eaed; --ink-soft:#c5cad1;
    --muted:#9aa3ad; --faint:#6d7680;
    --line:#2a3138; --soft:#1a1f26; --rule:#2a3138;
    --gold:#b59a5c; --gold-soft:rgba(181,154,92,.32);
    --hl-bg:rgba(232,234,237,.05); --hl-ink:var(--ink);
    --dock:rgba(18,22,28,.94);
  }
  :root[data-theme="sepia"] {
    /* Quiet cool-warm wash — not cream/terracotta */
    --bg:#ebe8e2; --bg-deep:#e2ded6; --ink:#1c1a16; --ink-soft:#322f29;
    --muted:#6a655c; --faint:#918a7e;
    --line:#c9c3b8; --soft:#e4e0d8; --rule:#c9c3b8;
    --gold:#8f7a4a; --gold-soft:rgba(143,122,74,.32);
    --hl-bg:rgba(28,26,22,.04); --hl-ink:var(--ink);
    --dock:rgba(235,232,226,.94);
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(170,188,200,.26), transparent 55%),
      radial-gradient(90% 60% at 100% 100%, rgba(150,165,175,.16), transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--ink); font-family:var(--ui-font);
    line-height:1.5; -webkit-font-smoothing:antialiased;
    transition:background var(--dur-view) var(--ease),color var(--dur-view) var(--ease); min-height:100vh;
  }
  :root[data-theme="dark"] body {
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(80,100,120,.18), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    background-attachment:fixed;
  }
  a { color:inherit; text-decoration:none; }
  button, select { font-family:inherit; }
  .hidden { display:none !important; }

  /* Top brand bar — quiet; on landing it yields to the hero brand */
  .topbar {
    position:relative; z-index:40;
    height:var(--header-h);
  }
  .topbar:has(.settings.open) { z-index:46; }
  .topbar .in {
    max-width:42rem; margin:0 auto; height:100%;
    display:flex; align-items:center; gap:8px; padding:0 1.35rem;
    position:relative;
  }
  .brand { cursor:pointer; display:flex; align-items:center; gap:7px; line-height:1.15; min-width:0; min-height:36px; }
  .brand .mark {
    width:22px; height:22px; flex:none;
    background:var(--faint);
    mask:url("/favicon-stacked.svg?v=flat-gold") center / contain no-repeat;
  }
  :root[data-theme="dark"] .brand .mark { background:#f2bd51; }
  :root[data-theme="sepia"] .brand .mark { background:#896130; }
  .brand .name { font-weight:600; font-size:.82rem; letter-spacing:-.01em; color:var(--faint);
    transition:color .18s var(--ease-quick), opacity var(--dur-view) var(--ease); }
  .brand .name .dot { color:var(--gold); font-weight:400; }
  body[data-view="landing"] .brand { visibility:hidden; pointer-events:none; }
  body[data-view="reader"] .brand .name:hover { color:var(--ink); }
  .brand .tag { font-size:.68rem; color:var(--faint); font-weight:400; }
  body[data-view="reader"] .brand .tag { display:none; }
  .sp { flex:1; }

.book-header{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--rule)}
.book-header .in{justify-content:space-between}
.book-tools{display:flex;gap:.5rem;align-items:center;min-width:0}
.book-tools select{min-width:0;max-width:45vw;background:var(--soft);color:var(--ink);border:1px solid var(--rule);border-radius:.25rem;padding:.25rem}
.book-main{max-width:42rem;margin:auto;padding:1.5rem 1.35rem 9rem}
.book-main h1,.book-chapter{text-align:center;font-family:var(--ar-font);font-weight:400}
.book-main h1{font-size:2.6rem;padding-bottom:.75rem}
.book-chapter{font-size:1.6rem;color:var(--ink-soft);border-block:1px solid var(--rule);padding:.4rem 0;margin:1.6rem 0 .8rem;scroll-margin-top:4rem}
#book{font-family:var(--ar-font);font-size:var(--ar-size);line-height:var(--ar-lh)}
#book p{margin:.55rem 0}
.word{display:inline;font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
.word.active{background:var(--gold-soft);color:var(--hl-ink);border-radius:.15em}
.book-dock .in{max-width:42rem;margin:auto;padding:.5rem 1.35rem}
.book-dock audio{display:block;width:100%;height:42px;color-scheme:light}
:root[data-theme=dark] .book-dock audio{color-scheme:dark}
.book-dock label,#status{font-size:.9rem;color:var(--muted)}
  .dock {
    position:fixed; left:50%; bottom:1.35rem; transform:translateX(-50%);
    z-index:45; width:auto; min-width:min(280px, calc(100% - 24px));
    max-width:min(420px, calc(100% - 24px));
    padding:0.45rem 0.7rem calc(0.45rem + env(safe-area-inset-bottom));
    background:var(--dock); border:1px solid var(--rule);
    backdrop-filter:blur(10px); pointer-events:none;
    opacity:0; transition:opacity var(--dur-view) var(--ease);
  }
  .dock.is-in { opacity:1; }
  .dock.hidden { opacity:0 !important; pointer-events:none; }
  .dock .player {
    pointer-events:auto; max-width:none; margin:0;
    display:grid; grid-template-columns:auto 1fr auto auto;
    gap:0.45rem; align-items:center;
    padding:0;
  }
  .skip {
    flex:none; width:36px; height:36px; border-radius:0; border:0;
    background:transparent; color:var(--ink-soft); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:.62rem; font-weight:600; font-variant-numeric:tabular-nums;
    transition:color .2s ease;
  }
  .skip:hover { background:transparent; color:var(--ink); }
  .play {
    flex:none; width:48px; height:48px; border-radius:0; border:0;
    background:transparent; color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:color .2s ease;
  }
  .play:hover { color:var(--gold); }
  .play svg { width:20px; height:20px; fill:currentColor; }
  .track {
    flex:1; height:16px; background:transparent; border-radius:0;
    cursor:pointer; position:relative; min-width:48px; touch-action:pan-y;
  }
  .track::before {
    content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--rule); transform:translateY(-50%); pointer-events:none;
  }
  .track:focus-visible {
    outline:1px solid var(--gold);
    outline-offset:4px;
  }
  .track .fill {
    position:absolute; left:0; top:50%; bottom:auto; height:1px; width:0;
    background:var(--gold); border-radius:0; transform:translateY(-50%);
  }
  .time {
    flex:none; font-size:.72rem; color:var(--faint);
    font-variant-numeric:tabular-nums; min-width:72px; text-align:right;
  }

.book-main h1{font-size:clamp(1.85rem,4vw,2.3rem)}
#book{font-size:var(--book-size,1.65rem);line-height:1.95}
.dock.book-dock{
  left:max(12px, env(safe-area-inset-left));
  right:max(12px, env(safe-area-inset-right));
  bottom:.75rem;
  width:auto;
  min-width:0;
  max-width:33rem;
  margin-inline:auto;
  transform:none;
  pointer-events:auto;
}
.book-dock .player{grid-template-columns:auto minmax(0,1fr) auto}
.book-dock #seek{width:100%;accent-color:var(--gold);min-width:0}
.book-dock .time{min-width:0;white-space:nowrap}
.book-dock .options{display:flex;justify-content:space-between;gap:.5rem}
.book-dock #audio{display:none}
.book-tools label{display:flex;align-items:center;gap:.2rem;white-space:nowrap;color:var(--muted);font-size:.8rem}
</style>
</head>
<body data-view="reader">
<header class="book-header topbar" dir="ltr">
  <div class="in"><a class="brand" href="/#arabicWordLibrary"><span class="mark"></span><span class="name">hadith<span class="dot">.</span>to</span></a>
  <div class="book-tools" dir="rtl">
    <select id="chapters" aria-label="الفصول" disabled></select>
    <label>الخط <select id="font-size"><option value="1.4">صغير</option><option value="1.65" selected>متوسط</option><option value="2">كبير</option></select></label>
    <select id="theme" aria-label="المظهر"><option value="light">فاتح</option><option value="dark">داكن</option><option value="sepia">ورقي</option></select>
  </div></div>
</header>
<main class="book-main"><h1 id="title"></h1><p id="status" role="status">جارٍ تحميل الكتاب…</p><article id="book"></article></main>
<footer class="book-dock dock is-in">
  <audio preload="none" id="audio"></audio>
  <div class="player" dir="ltr">
    <button class="play" id="play" type="button" aria-label="تشغيل" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z"/></svg></button>
    <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="موضع التشغيل" disabled>
    <span id="time" class="time">0:00</span>
  </div>
  <div class="options"><label><input type="checkbox" id="follow" checked> متابعة القراءة</label><a id="audio-link" hidden>ملف الصوت</a></div>
  <p id="audio-error" role="status" hidden></p>
</footer>
<script src="/arabic-book.js?v=audio-dock" defer></script>
</body>
</html>
