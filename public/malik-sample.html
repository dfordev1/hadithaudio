<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muwatta Malik — Book 1 word-by-word (sample)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Scheherazade+New:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#121212; --muted:#6a6a6a; --faint:#9b9b9b; --line:#ececec; --hl:#fff3cf;
    --ar:"KFGQPC Uthman Taha Naskh","Scheherazade New",serif; --ui:Inter,-apple-system,sans-serif; --ur:"Noto Nastaliq Urdu",serif; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f0f0f; --ink:#ececec; --muted:#9a9a9a; --faint:#6a6a6a; --line:#262626; --hl:#3a3320; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:var(--ui); padding:0 18px 80px; -webkit-font-smoothing:antialiased; }
  header { border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header .in { max-width:940px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:15px 2px; }
  h1 { font-size:1.02rem; font-weight:700; flex:1; } h1 span { color:var(--faint); font-weight:500; font-size:.82rem; }
  .toggles { display:flex; gap:8px; }
  .toggles b { cursor:pointer; font-weight:500; font-size:.8rem; border:1px solid var(--line); border-radius:20px; padding:6px 13px; color:var(--muted); }
  .toggles b.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  main { max-width:940px; margin:0 auto; padding-top:8px; }
  .bk { text-align:center; padding:26px 0 18px; border-bottom:1px solid var(--line); }
  .bk .ar { font-family:var(--ar); direction:rtl; font-size:1.9rem; }
  section { padding:26px 0; border-bottom:1px solid var(--line); }
  .hn { font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:.72rem; color:var(--ink); }
  .isnad { color:var(--faint); font-size:.74rem; margin:5px 0 16px; direction:rtl; font-family:var(--ar); }
  .wbw { direction:rtl; display:flex; flex-wrap:wrap; gap:6px 3px; }
  .w { display:inline-flex; flex-direction:column; align-items:center; padding:6px 7px 8px; border-radius:9px; }
  .w:hover { background:var(--hl); }
  .w .t { font-family:var(--ar); font-size:1.75rem; line-height:1.9; }
  .w .en { font-family:var(--ui); font-size:.68rem; color:var(--muted); direction:ltr; margin-top:4px; text-align:center; max-width:120px; line-height:1.3; }
  .w .ur { font-family:var(--ur); font-size:.78rem; color:var(--muted); direction:rtl; margin-top:5px; text-align:center; max-width:130px; line-height:1.85; }
  body.hide-en .w .en{display:none} body.hide-ur .w .ur{display:none}
  .miss { color:var(--faint); font-size:.75rem; font-style:italic; }
  .note { color:var(--faint); font-size:.76rem; margin:30px auto 0; max-width:680px; line-height:1.7; text-align:center; }
</style>

<header><div class="in">
  <h1>Muwatta Malik <span>· Book 1 word-by-word — SAMPLE</span></h1>
  <div class="toggles"><b data-l="en" class="on">English</b><b data-l="ur" class="on">اردو</b></div>
</div></header>

<main>
  <div class="bk"><div class="ar">كتاب وقوت الصلاة</div><div style="color:var(--muted);font-size:.9rem;margin-top:3px">The Times of Prayer</div></div>
  <div id="list" class="miss" style="padding:40px 0">Loading…</div>
  <div class="note" id="note"></div>
</main>

<script>
(async () => {
  const data = await (await fetch("malik-sample.json",{cache:"no-cache"})).json();
  const list = document.getElementById("list"); list.className=""; list.innerHTML="";
  let glossed=0;
  for (const h of data.hadith) {
    const g = await (await fetch(`gloss/malik-${h.n}.json`,{cache:"no-cache"}).catch(()=>null))?.json?.() ?? null;
    const G = g&&g.glosses ? g.glosses : null; if(G) glossed++;
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="hn">Muwatta Malik ${h.n}</div><div class="isnad">${h.isnad}</div>`;
    const wbw = document.createElement("div"); wbw.className="wbw";
    for (const t of h.tokens) {
      const gg = G ? (G[t.id]||{}) : {};
      const d = document.createElement("div"); d.className="w";
      d.innerHTML = `<span class="t">${t.text.replace(/[،:]/g,"")}</span><span class="en">${gg.en||""}</span><span class="ur">${gg.ur||""}</span>`;
      wbw.appendChild(d);
    }
    if(!G){ const m=document.createElement("span"); m.className="miss"; m.textContent=" (glosses pending)"; sec.querySelector(".hn").appendChild(m); }
    sec.appendChild(wbw); list.appendChild(sec);
  }
  document.getElementById("note").textContent =
    `${glossed}/${data.hadith.length} hadith glossed. Machine-generated (machine-suggested), anchored to the eng-malik & urd-malik translations. A sample to gauge quality before the full ~93k-token run.`;
})();
document.querySelectorAll(".toggles b").forEach(b => b.onclick = () => { b.classList.toggle("on"); document.body.classList.toggle("hide-"+b.dataset.l, !b.classList.contains("on")); });
</script>
