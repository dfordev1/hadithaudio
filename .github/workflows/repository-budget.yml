name: Repository budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce deployment and file-size budgets
        run: python scripts/check-repository-size.py
      - name: Validate compact gloss manifest
        run: python scripts/validate-compact-gloss-data.py
