name: Decode Ibn Majah with MMS

on:
  push:
    branches:
      - codex/ibn-majah-mms-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    name: Decode shard ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 0
            tracks: "06"
          - id: 1
            tracks: "02 33 29 28"
          - id: 2
            tracks: "01 11 17 04 19"
          - id: 3
            tracks: "36 30 05 03 15"
          - id: 4
            tracks: "35 32 09 12 23"
          - id: 5
            tracks: "26 08 14 24 20"
          - id: 6
            tracks: "07 25 21 31 34"
          - id: 7
            tracks: "10 13 22 16 27 18"

    steps:
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet onnxruntime numpy

      - name: Download verified MMS model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://huggingface.co/romara-labs/mms-300m-1130-forced-aligner-ONNX/resolve/main/model.q8.onnx?download=true' \
            --output model/model.q8.onnx
          curl --fail --location --retry 5 \
            'https://huggingface.co/romara-labs/mms-300m-1130-forced-aligner-ONNX/resolve/main/vocab.json?download=true' \
            --output model/vocab.json
          echo 'bef3271b8f4496fd173da1d2392c4bc7d496e0245cf1e8700481f812795b4abe  model/model.q8.onnx' | sha256sum --check

      - name: Download source recordings
        shell: bash
        env:
          TRACKS: ${{ matrix.tracks }}
        run: |
          set -euo pipefail
          mkdir -p audio
          for track in $TRACKS; do
            url="https://d1.islamhouse.com/data/ar/ih_sounds/chain/ar_Sonan_Ibn_Majah_A_B/ar_Sonan_Ibn_Majah_A_B_${track}.mp3"
            echo "Downloading track ${track}"
            curl --fail --location --retry 8 --retry-delay 5 "$url" --output "audio/${track}.mp3"
            ffprobe -v error -show_entries format=duration,size -of json "audio/${track}.mp3"
          done

      - name: Decode timestamped CTC characters
        shell: bash
        env:
          TRACKS: ${{ matrix.tracks }}
          SHARD_ID: ${{ matrix.id }}
        run: |
          cat > decode.py <<'PY'
          import gzip, hashlib, json, os, subprocess, time
          from pathlib import Path
          import numpy as np
          import onnxruntime as ort

          ROOT=Path('.')
          OUT=ROOT/'decoded';OUT.mkdir(exist_ok=True)
          tracks=os.environ['TRACKS'].split()
          so=ort.SessionOptions();so.intra_op_num_threads=4;so.inter_op_num_threads=1;so.execution_mode=ort.ExecutionMode.ORT_SEQUENTIAL
          session=ort.InferenceSession('model/model.q8.onnx',sess_options=so,providers=['CPUExecutionProvider'])
          vocab=json.load(open('model/vocab.json'));id2={i:t for t,i in vocab.items()}
          has_mask=any(x.name=='attention_mask' for x in session.get_inputs())

          def duration(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)]))
          def read_exact(pipe,n):
              chunks=[];got=0
              while got<n:
                  b=pipe.read(n-got)
                  if not b:break
                  chunks.append(b);got+=len(b)
              return b''.join(chunks)
          manifest=[]
          for ts in tracks:
              track=int(ts);mp3=Path('audio')/f'{ts}.mp3';total=duration(mp3)
              cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-threads','1','-i',str(mp3),'-vn','-sn','-dn','-ac','1','-ar','16000','-f','s16le','-']
              p=subprocess.Popen(cmd,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,bufsize=1024*1024)
              sr=16000;chunk_seconds=10;block=sr*chunk_seconds*2;offset=0;chars=[];chunks=[];ci=0;tstart=time.time()
              while True:
                  bb=read_exact(p.stdout,block)
                  if not bb:break
                  y=np.frombuffer(bb,dtype=np.int16).astype(np.float32)/32768.0
                  if len(y)<sr//2:break
                  raw_std=float(y.std());yn=(y-y.mean())/(raw_std+1e-7);inp=yn[None].astype(np.float32);feed={'input_values':inp}
                  if has_mask:feed['attention_mask']=np.ones(inp.shape,dtype=np.int64)
                  t0=time.time();logits=session.run(None,feed)[0][0];infer=time.time()-t0
                  ids=logits.argmax(axis=1);mx=logits.max(axis=1,keepdims=True);ex=np.exp(logits-mx);den=ex.sum(axis=1);frame_s=(len(y)/sr)/len(ids);rs=0;local=[]
                  for k in range(1,len(ids)+1):
                      if k==len(ids) or ids[k]!=ids[rs]:
                          idx=int(ids[rs]);re_=k;tok=id2.get(idx,'')
                          if idx!=0 and tok and not tok.startswith('<'):
                              score=float((ex[rs:re_,idx]/den[rs:re_]).mean())
                              rec={'char':tok,'start':round(offset/sr+rs*frame_s,6),'end':round(offset/sr+re_*frame_s,6),'score':round(score,6)}
                              chars.append(rec);local.append(rec)
                          rs=k
                  chunks.append({'index':ci,'start':round(offset/sr,6),'end':round((offset+len(y))/sr,6),'samples':len(y),'frames':len(ids),'characters':len(local),'inferenceSeconds':round(infer,4),'inputStd':round(raw_std,6),'text':''.join(x['char'] for x in local)})
                  offset+=len(y);ci+=1
                  if ci%60==0:print(json.dumps({'track':track,'decodedSeconds':offset/sr,'totalSeconds':total,'chunks':ci}),flush=True)
              if p.stdout:p.stdout.close()
              rc=p.wait(timeout=30)
              if rc!=0:raise RuntimeError(f'ffmpeg failed {rc} for {track}')
              data={'schema':'ibnmajah-mms-ctc-characters/2','track':track,'audioFile':mp3.name,'sourceUrl':f'https://d1.islamhouse.com/data/ar/ih_sounds/chain/ar_Sonan_Ibn_Majah_A_B/ar_Sonan_Ibn_Majah_A_B_{ts}.mp3','duration':total,'decodedDuration':offset/sr,'sampleRate':sr,'chunkSeconds':chunk_seconds,'model':'model.q8.onnx','modelSha256':'bef3271b8f4496fd173da1d2392c4bc7d496e0245cf1e8700481f812795b4abe','characterCount':len(chars),'text':''.join(x['char'] for x in chars),'chars':chars,'chunks':chunks}
              out=OUT/f'{track:03d}.characters.json.gz';tmp=out.with_name(out.name+'.part')
              with gzip.open(tmp,'wt',encoding='utf-8',compresslevel=5) as f:json.dump(data,f,ensure_ascii=False,separators=(',',':'))
              os.replace(tmp,out)
              sha=hashlib.sha256(out.read_bytes()).hexdigest();manifest.append({'track':track,'file':out.name,'sha256':sha,'duration':total,'decodedDuration':offset/sr,'characterCount':len(chars),'seconds':time.time()-tstart})
              print(json.dumps(manifest[-1]),flush=True)
          json.dump({'schema':'ibnmajah-mms-shard-manifest/1','shard':int(os.environ['SHARD_ID']),'tracks':manifest},open(OUT/'manifest.json','w'),indent=2)
          PY
          python -u decode.py

      - name: Upload decoded shard
        uses: actions/upload-artifact@v4
        with:
          name: ibnmajah-mms-shard-${{ matrix.id }}
          path: decoded/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
