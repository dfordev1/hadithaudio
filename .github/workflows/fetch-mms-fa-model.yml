name: Fetch MMS forced-aligner model

on:
  push:
    branches:
      - codex/ibn-majah-mms-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-q4-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Q4 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mms-q4-model
          curl --fail --location --retry 5 --retry-delay 5 \
            'https://huggingface.co/onnx-community/mms-300m-1130-forced-aligner-ONNX/resolve/main/onnx/model_q4.onnx?download=true' \
            --output mms-q4-model/model_q4.onnx
          sha256sum mms-q4-model/model_q4.onnx | tee mms-q4-model/model_q4.onnx.sha256
          ls -lh mms-q4-model/

      - name: Upload Q4 model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mms-fa-q4-model
          path: mms-q4-model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
